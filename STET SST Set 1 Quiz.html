<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STET SST Set 1</title>
<style>
  :root{
    --ink:#1c2b2d;
    --paper:#f6f2e9;
    --paper-2:#eee7d8;
    --rule:#cdbfa0;
    --accent:#8a3324;   /* terracotta-brick, exam-stamp red */
    --accent-2:#2f5233; /* ledger green */
    --gold:#9c7a2e;
    --correct-bg:#e3efe0;
    --correct-bd:#3f7d4a;
    --wrong-bg:#f6e0dd;
    --wrong-bd:#a4372a;
    --selected:#f0e2b8;
    --white:#fffdf7;
    font-family:"Noto Serif","Noto Serif Devanagari",Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    background-image:
      linear-gradient(var(--paper-2) 1px, transparent 1px);
    background-size: 100% 2.1em;
  }
  header{
    background:var(--ink);
    color:var(--paper);
    padding:22px 18px 26px;
    border-bottom:6px double var(--gold);
    position:relative;
    cursor:pointer;
    user-select:none;
  }
  header .kicker{
    letter-spacing:.14em;
    font-size:.7rem;
    color:var(--gold);
    text-transform:uppercase;
  }
  header h1{
    margin:.25em 0 .1em;
    font-size:1.5rem;
    line-height:1.3;
    font-weight:700;
  }
  header p.sub{
    margin:0;
    font-size:.85rem;
    color:#d9cfa9;
  }
  .progress-wrap{
    max-width:900px;margin:16px auto 0;padding:0 18px;
  }
  .progress-bar{
    height:8px;background:var(--paper-2);border:1px solid var(--rule);
    border-radius:20px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--accent-2);width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-size:.75rem;color:#5a5145;margin-top:4px;text-align:right;
  }

  .toolbar{
    max-width:900px;margin:14px auto 0;padding:0 18px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .searchBox{
    flex:1;
    min-width:200px;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--rule);
    background:var(--paper-2);
    color:var(--ink);
    font-family:inherit;
    font-size:.85rem;
  }
  .searchBox:focus{
    outline:none;
    border-color:var(--gold);
    background:var(--white);
  }
  .iconbtn{
    background:var(--paper-2);
    border:1px solid var(--rule);
    color:var(--ink);
    font-size:1.05rem;
    width:38px;height:38px;
    border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-family:inherit;
    line-height:1;
    padding:0;
    flex-shrink:0;
  }
  .iconbtn:hover{background:var(--selected);}
  .iconbtn.small{width:30px;height:30px;font-size:.9rem;background:var(--paper);}
  .iconbtn.active{background:var(--accent-2);color:var(--white);border-color:var(--accent-2);}
  #langGlobalBtn{font-weight:700;font-size:.85rem;background:var(--gold);color:var(--white);border-color:var(--gold);width:auto;border-radius:20px;padding:0 16px;}
  #langGlobalBtn:hover{opacity:.85;}
  #langGlobalBtn.active{background:var(--accent-2);border-color:var(--accent-2);}
  .timerDisplay{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--paper-2);border:1px solid var(--rule);
    padding:0 14px;height:38px;border-radius:20px;
    font-size:.85rem;font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .timerDisplay.timeup{background:var(--wrong-bg);border-color:var(--wrong-bd);color:var(--wrong-bd);font-weight:700;}

  .modalOverlay{
    display:none;
    position:fixed;inset:0;background:rgba(28,43,45,.55);
    z-index:100;
    align-items:center;justify-content:center;
    padding:18px;
  }
  .modalOverlay.open{display:flex;}
  .modalBox{
    background:var(--white);
    border:1px solid var(--gold);
    border-radius:6px;
    max-width:520px;width:100%;
    max-height:80vh;
    overflow-y:auto;
    padding:18px;
  }
  .modalBox h3{margin:0 0 4px;font-size:1.05rem;}
  .modalLegend{font-size:.75rem;color:#5a5145;margin-bottom:12px;}
  .modalLegend span{display:inline-flex;align-items:center;gap:4px;margin-right:14px;}
  .legendDot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dashGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(38px,1fr));
    gap:6px;
  }
  .dashCell{
    aspect-ratio:1;
    border-radius:4px;
    border:none;
    color:var(--white);
    font-size:.75rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .dashCell.attempted{background:var(--correct-bd);}
  .dashCell.unattempted{background:var(--wrong-bd);}
  .modalCloseBtn{
    margin-top:14px;
    width:100%;
    padding:9px;
    border:1px solid var(--rule);
    background:var(--paper-2);
    border-radius:4px;
    cursor:pointer;
    font-family:inherit;
    font-size:.85rem;
  }

  main{max-width:900px;margin:0 auto;padding:20px 14px 10px;}

  .qcard{
    background:var(--white);
    border:1px solid var(--rule);
    border-radius:4px;
    margin-bottom:18px;
    padding:16px 16px 14px;
    box-shadow: 2px 2px 0 rgba(140,120,80,.15);
    scroll-margin-top:20px;
  }
  .qcard.correct{border-color:var(--correct-bd);}
  .qcard.incorrect{border-color:var(--wrong-bd);}

  .qhead{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    margin-bottom:8px;
  }
  .qnum{
    font-weight:700;color:var(--accent);
    font-size:.95rem;flex-shrink:0;
  }
  .langbtn{
    background:var(--paper-2);
    border:1px solid var(--rule);
    color:var(--ink);
    font-size:.72rem;
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    font-family:inherit;
  }
  .langbtn:hover{background:var(--selected);}

  .qtext{white-space:pre-line;
    font-size:1.02rem;
    line-height:1.55;
    margin:0 0 12px;
  }

  .options{
    display:grid;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1px solid var(--rule);
    background:var(--paper);
    border-radius:4px;
    padding:9px 12px;
    cursor:pointer;
    font-size:.95rem;
    line-height:1.4;
    transition:background .12s ease, border-color .12s ease;
  }
  .opt:hover{border-color:var(--gold);}
  .opt .tag{
    font-weight:700;
    color:var(--gold);
    flex-shrink:0;
  }
  .opt.selected{
    background:var(--selected);
    border-color:var(--gold);
  }
  .opt.locked{cursor:default;}
  .opt.review-correct{
    background:var(--correct-bd);
    border-color:var(--correct-bd);
    color:var(--white);
  }
  .opt.review-wrong{
    background:var(--wrong-bd);
    border-color:var(--wrong-bd);
    color:var(--white);
  }
  .opt.review-correct .tag, .opt.review-wrong .tag{color:var(--white);}

  .qfoot{
    margin-top:10px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .result-pill{
    font-size:.75rem;
    padding:3px 10px;
    border-radius:20px;
    font-weight:700;
  }
  .result-pill.correct{background:var(--correct-bg);color:var(--correct-bd);border:1px solid var(--correct-bd);}
  .result-pill.incorrect{background:var(--wrong-bg);color:var(--wrong-bd);border:1px solid var(--wrong-bd);}

  .explbtn.active{background:var(--accent-2);color:var(--white);border-color:var(--accent-2);}

  .explanation{
    display:none;
    margin-top:10px;
    padding:10px 12px;
    background:var(--paper-2);
    border-left:3px solid var(--accent-2);
    font-size:.88rem;
    line-height:1.5;
  }
  .explanation.open{display:block;}

  /* End-of-quiz submit bar */
  .submitbar{
    background:var(--ink);
    padding:16px;
    display:flex;justify-content:center;gap:12px;
    border-radius:4px;
    margin-top:22px;
    border:3px solid var(--gold);
  }
  .submitbar button{
    font-family:inherit;
    font-size:.95rem;
    font-weight:700;
    padding:11px 26px;
    border-radius:4px;
    border:none;
    cursor:pointer;
  }
  #submitBtn{background:var(--accent);color:var(--white);}
  #submitBtn:hover{background:#6f2519;}
  #jumpBtn{background:transparent;color:var(--paper);border:1px solid var(--rule);}

  /* Score panel */
  #scorePanel{
    display:none;
    background:var(--white);
    border:1px solid var(--gold);
    border-radius:4px;
    padding:22px;
    margin-bottom:22px;
    text-align:center;
  }
  #scorePanel .scoreNum{
    font-size:2.6rem;
    color:var(--accent);
    font-weight:700;
    margin:4px 0;
  }
  #scorePanel .scoreLabel{font-size:.85rem;color:#5a5145;}
  .filterRow{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;
  }
  .filterRow button{
    font-family:inherit;
    background:var(--paper-2);
    border:1px solid var(--rule);
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
    font-size:.85rem;
  }
  .filterRow button:hover{background:var(--selected);}
  .filterRow button.active{
    background:var(--accent-2);color:var(--white);border-color:var(--accent-2);
  }

  #retakeBanner{
    display:none;
    background:var(--selected);
    border:1px solid var(--gold);
    padding:10px 14px;
    border-radius:4px;
    font-size:.85rem;
    margin-bottom:14px;
    text-align:center;
  }

  .hidden{display:none !important;}

  @media (min-width:640px){
    header h1{font-size:1.9rem;}
    .qtext{font-size:1.08rem;}
  }

  /* excel-export */
  .exportBox{margin-top:18px;padding:14px;border:1px dashed var(--rule);border-radius:8px;background:var(--paper-2);text-align:left}
  .exportBox h4{margin:0 0 8px;font-size:.95rem}
  .exportBox label{display:block;font-size:.8rem;margin:6px 0 3px}
  .exportBox input[type=text]{width:100%;box-sizing:border-box;padding:8px 10px;font:inherit;font-size:.85rem;border:1px solid var(--rule);border-radius:6px;background:var(--white);color:inherit}
  .exportBox .chk{display:flex;align-items:center;gap:6px;font-size:.8rem;margin-top:8px}
  .exportScroll{overflow-x:auto;margin-top:10px}
  .exportBox table{border-collapse:collapse;font-size:.75rem;min-width:100%}
  .exportBox th,.exportBox td{border:1px solid var(--rule);padding:4px 7px;white-space:nowrap;text-align:left}
  .exportBox th{background:var(--selected)}
  #copyExcelBtn{margin-top:12px;font-family:inherit;font-size:.85rem;padding:10px 16px;border-radius:20px;border:1px solid var(--accent-2);background:var(--accent-2);color:var(--white);cursor:pointer;width:100%}
  #copyExcelBtn:disabled{opacity:.5;cursor:not-allowed}
  #copyStatus{font-size:.78rem;margin-top:6px;min-height:1.1em}

  /* new-features */
  #instaBtn{font-weight:700;font-size:.85rem;width:auto;border-radius:20px;padding:0 16px;background:var(--paper-2);}
  #instaBtn.active{background:var(--accent-2);color:var(--white);border-color:var(--accent-2);}
  .thinCard{max-width:900px;margin:10px auto 0;padding:0 18px;}
  .thinCard .thinInner{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;font-size:.78rem;}
  .rcTitle{font-weight:700;color:var(--accent);margin-bottom:4px;}
  .rcHeads{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
  .rcChip{background:var(--selected);border:1px solid var(--rule);border-radius:10px;padding:1px 8px;font-size:.7rem;white-space:nowrap;}
  .rcRow{display:flex;gap:8px;align-items:stretch;}
  #pasteBox{flex:1;min-width:0;font:inherit;font-size:.78rem;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:inherit;resize:vertical;height:30px;min-height:30px;white-space:pre;overflow:auto;}
  #restoreBtn,#expandAllBtn{font-family:inherit;font-size:.8rem;padding:5px 14px;border-radius:20px;border:1px solid var(--accent-2);background:var(--accent-2);color:var(--white);cursor:pointer;}
  #restoreStatus{min-height:1em;margin-top:3px;font-size:.72rem;}
  #restoreStatus.bad{color:var(--wrong-bd);}
  #restoreStatus.ok{color:var(--correct-bd);}
  .expandCard{margin:0 0 14px;background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;text-align:center;}
</style>
<style>/*pre-line-expl*/[class*="expl"],[id*="expl"]{white-space:pre-line}</style></head>
<body>

<header id="headerElem" title="Double tap to toggle fullscreen / फुलस्क्रीन चालू/बंद करने के लिए दो बार टैप करें">
   <center><h1>STET SST Set 1</h1></center>
   <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 100 answered</div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchBox" class="searchBox" placeholder="🔍 Search question (Hindi/English)...">
    <button id="instaBtn" class="iconbtn" type="button" aria-pressed="false" title="Instant response: show result and explanation as soon as an option is selected">InstaResp</button>
    <button id="langGlobalBtn" class="iconbtn" type="button" title="Switch all questions' language / सभी प्रश्नों की भाषा बदलें">In English</button>
    <span class="timerDisplay" id="timerDisplay" title="Time elapsed"><span id="timerText">0:00:00</span></span>
    <button id="dashboardBtn" class="iconbtn" type="button" title="Question dashboard / प्रश्न डैशबोर्ड">📊</button>
    <button id="fullscreenBtn" class="iconbtn" type="button" title="Toggle full screen">⛶</button>
  </div>
</header>

<section class="thinCard" id="restoreCard">
  <div class="thinInner">
    <div class="rcTitle">⟲ Restore previous attempt / पिछला प्रयास पुनः लोड करें</div>
    <div class="rcHeads" id="rcHeads"></div>
    <div class="rcRow">
      <textarea id="pasteBox" rows="1" placeholder="Paste the copied Excel row here (columns in the order shown above) / कॉपी की हुई एक्सेल पंक्ति यहाँ पेस्ट करें"></textarea>
      <button id="restoreBtn" type="button">Restore</button>
    </div>
    <div id="restoreStatus"></div>
  </div>
</section>

<main>
  <div id="retakeBanner"></div>
  <div id="scorePanel">
    <div class="scoreLabel">आपका स्कोर / Your Score</div>
    <div class="scoreNum"><span id="scoreVal">0</span> / 100</div>
    <div class="scoreLabel" id="scoreSub"></div>
    <div class="scoreLabel" id="timeTakenLabel" style="margin-top:4px;font-weight:700;"></div>
    <div class="filterRow">
      <button id="showAllBtn" class="active">सभी दिखाएं / Show All</button>
      <button id="showIncorrectBtn">Show Incorrect</button>
      <button id="showCorrectBtn">Show Correct</button>
      <button id="retakeBtn">Retake Incorrect</button>
    </div>

    <div class="exportBox" id="exportBox">
      <h4>📋 Export Data to Excel for Record / एक्सेल रिकॉर्ड के लिए डेटा</h4>
      <label for="paperName">Test Paper/Set</label>
      <input type="text" id="paperName" value="STET SST Set 1">
      <div class="exportScroll"><table id="exportPreview"></table></div>
      <label class="chk"><input type="checkbox" id="withHeader"> Include header row (first time only) / हेडर पंक्ति जोड़ें</label>
      <button id="copyExcelBtn" type="button" disabled>Copy Tab-Separated Data for Excel record</button>
      <div id="copyStatus"></div>
    </div>
  </div>

  <div class="expandCard"><button id="expandAllBtn" type="button">▾ Expand All Explanations</button></div>

  <div id="quizContainer"></div>

  <div class="submitbar">
    <button id="jumpBtn" type="button">↑ Top</button>
    <button id="submitBtn" type="button">Submit All Answers</button>
  </div>
</main>

<div class="modalOverlay" id="dashboardModal">
  <div class="modalBox">
    <h3>प्रश्न डैशबोर्ड / Question Dashboard</h3>
    <div class="modalLegend">
      <span><span class="legendDot" style="background:var(--correct-bd)"></span>Attempted / हल किया गया</span>
      <span><span class="legendDot" style="background:var(--wrong-bd)"></span>Unattempted / अनुत्तरित</span>
    </div>
    <div class="dashGrid" id="dashGrid"></div>
    <button class="modalCloseBtn" id="dashboardCloseBtn" type="button">Close / बंद करें</button>
  </div>
</div>

<script>
/* ============ DATA ============ */
const DATA = [
  [
    ["भारत में \"पंथनिरपेक्षता / धर्मनिरपेक्षता (Secularism)\" की संवैधानिक अवधारणा के संदर्भ में निम्नलिखित में से कौन-सा कथन सही है?", "With reference to the constitutional concept of 'Secularism' in India, which of the following statements is correct?"],
    [["राज्य और धर्म के बीच पूर्णतः सख्त पृथक्करण (Strict Water-tight Separation) होता है।", "There is a strict water-tight separation between state and religion."], ["राज्य धार्मिक मामलों में किसी भी परिस्थिति में हस्तक्षेप नहीं कर सकता।", "The state cannot interfere in religious matters under any circumstances."], ["राज्य सैद्धांतिक दूरी (Principled Distance) बनाए रखते हुए सामाजिक न्याय व समानता हेतु धार्मिक कुरीतियों में हस्तक्षेप कर सकता है।", "The state can interfere in religious evils for social justice and equality while maintaining a principled distance."], ["राज्य केवल बहुसंख्यक समुदाय के धार्मिक अधिकारों एवं परंपराओं की सुरक्षा के लिए नीतियाँ बनाता है।", "The state makes policies only for the protection of religious rights and traditions of the majority community."]],
    2,
    ["भारत में \"पंथनिरपेक्षता / धर्मनिरपेक्षता (Secularism)\" की संवैधानिक अवधारणा के तहत राज्य सैद्धांतिक दूरी (Principled Distance) बनाए रखते हुए सामाजिक न्याय व समानता हेतु धार्मिक कुरीतियों में हस्तक्षेप कर सकता है।\n• भारतीय धर्मनिरपेक्षता पश्चिमी मॉडल (सख्त पृथक्करण) से भिन्न है, जहाँ राज्य और धर्म के बीच 'सैद्धांतिक दूरी' की नीति अपनाई गई है।\n• भारतीय संविधान के तहत राज्य सभी धर्मों को समान आदर (सर्व धर्म समभाव) देता है, लेकिन समाज सुधार (जैसे छुआछूत, सती प्रथा, तीन तलाक आदि) के लिए धार्मिक मामलों में सकारात्मक हस्तक्षेप कर सकता है।\n• 42वें संविधान संशोधन अधिनियम, 1976 द्वारा भारतीय संविधान की प्रस्तावना में 'पंथनिरपेक्ष' (Secular) शब्द स्पष्ट रूप से जोड़ा गया था।\n• संविधान के भाग-III में अनुच्छेद 25 से 28 तक नागरिकों को धार्मिक स्वतंत्रता का मौलिक अधिकार प्रदान किया गया है, जो सार्वजनिक व्यवस्था, नैतिकता और स्वास्थ्य के अधीन है।", "Under the constitutional concept of Secularism in India, the state can interfere in religious malpractices for social justice and equality while maintaining a principled distance.\n• Indian secularism differs from the Western model (strict separation), adopting a policy of 'principled distance' between state and religion.\n• Under the Indian Constitution, the state gives equal respect to all religions (Sarva Dharma Sambhava), but can make positive interventions in religious matters for social reform (such as untouchability, sati, triple talaq, etc.).\n• The word 'Secular' was explicitly added to the Preamble of the Indian Constitution by the 42nd Constitutional Amendment Act, 1976.\n• Articles 25 to 28 in Part III of the Constitution guarantee fundamental rights to freedom of religion, subject to public order, morality and health."]
  ],
  [
    ["मृदा क्षरण रोकने के लिए किस फसल का प्रयोग करना चाहिए?", "Which crop should be used to prevent soil erosion?"],
    [["बीन (फलीदार फसल)", "Bean (Leguminous crop)"], ["बार्ली (जौ)", "Barley"], ["सोर्घम (ज्वार)", "Sorghum"], ["पैडी (धान)", "Paddy"]],
    0,
    ["मृदा क्षरण रोकने के लिए बीन (फलीदार फसल) का प्रयोग करना चाहिए।\n• फसल द्वारा मृदा संरक्षण में बिना जुताई वाली खेती को प्राथमिकता दी जाती है। इसमें हरित खाद वाली खेती को प्रमुखता दी जाती है।\n• बिना जुताई वाली खेती को प्राथमिकता देने का मुख्य कारण है - (i) मृदा अपरदन पर रोक (ii) नमी का संरक्षण (iii) जैविक कार्बन में वृद्धि आदि।\n• हरित खाद या बीन वाली फसल भूमि में नाइट्रोजन का स्थिरीकरण करने में महत्वपूर्ण भूमिका निभाती है।\n• मृदा संरक्षण की तकनीकों में समोच्च जुताई, सीढ़दार खेती, फसल चक्र एवं मेड़बंदी/वनरोपण शामिल हैं।\n• पेडोलॉजी में मृदा का अध्ययन किया जाता है।", "Beans (leguminous crops) should be used to prevent soil erosion.\n• In soil conservation through crops, zero-tillage farming and green manure crops are prioritized.\n• Main reasons for prioritizing zero-tillage: (i) control of soil erosion, (ii) moisture conservation, (iii) increase in organic carbon, etc.\n• Leguminous crops play a crucial role in nitrogen fixation in the soil.\n• Soil conservation techniques include contour ploughing, terrace farming, crop rotation, bunding/afforestation.\n• Pedology is the study of soil."]

  [
    ["भारत में विकसित प्रथम बौनी धान की किस्म थी-", "The first dwarf paddy variety developed in India was-"],
    [["आई० आर०-८", "IR-8"], ["जया", "Jaya"], ["पद्मा", "Padma"], ["रत्ना", "Ratna"]],
    1,
    ["चावल अनुसंधान निदेशालय द्वारा विकसित की गई भारत की पहली बौनी धान की किस्म \"जया\" थी।\n• चावल अनुसंधान निदेशालय द्वारा जया चावल को 1968 में विकसित किया गया था, इसे 'चमत्कारी चावल' (Miracle Rice) भी कहा जाता है।\n• IR-8 को विश्वस्तर पर चमत्कारी चावल कहा गया। जया भारत में विकसित प्रथम बौनी किस्म थी।\n• भारत दुनिया का सबसे बड़ा चावल निर्यातक भी है। भारत में चावल उत्पादन के प्रमुख राज्य पश्चिम बंगाल, यू०पी०, आंध्र प्रदेश, पंजाब और तमिलनाडु हैं।\n• भारत में चावल की कुछ लोकप्रिय किस्में बासमती, सोना मसूरी, इंद्रायणी, और पलक्कडन मट्टा हैं।", "The first dwarf paddy variety developed in India was 'Jaya'.\n• Jaya rice was developed in 1968 by the Directorate of Rice Research and is also known as 'Miracle Rice' in India.\n• IR-8 was called miracle rice globally; Jaya was the first dwarf variety developed indigenously in India.\n• India is the largest exporter of rice globally. Major rice-producing states in India include West Bengal, UP, Andhra Pradesh, Punjab, and Tamil Nadu."]

    ["पीली क्रांति भारत में तिलहन के उत्पादन से संबंधित है।\n• भारत में पीली/तिलहन क्रांति की शुरुआत 1986-87 में की गई थी।\n• तिलहन प्रौद्योगिकी मिशन की नींव 1986 में तत्कालीन प्रधानमंत्री राजीव गाँधी द्वारा रखी गई।\n• भारत में पीली क्रांति का जनक सैम पित्रोदा को माना जाता है।\n• प्रमुख क्रांतियाँ: गोल क्रांति (आलू), हरित क्रांति (खाद्यान्न), धूसर क्रांति (उर्वरक), श्वेत क्रांति (दूध), नीली क्रांति (मछली), लाल क्रांति (मांस/टमाटर)।", "Yellow Revolution is related to oilseed production in India.\n• The Yellow Revolution in oilseeds was launched in India in 1986-87.\n• Oilseeds Technology Mission was set up in 1986 under Prime Minister Rajiv Gandhi.\n• Sam Pitroda is considered the father of the Yellow Revolution in India.\n• Major revolutions: Round (Potato), Green (Foodgrains), Grey (Fertilizer), White (Milk), Blue (Fish), Red (Meat/Tomato)."]

    ["ट्रिटिकेल (Triticale) को मानव उत्पाद धान्य अन्न (Man-made cereal grain) कहा जाता है।\n• यह गेहूँ (Wheat) और राई (Rye) के संकरण (Hybridization) से बनता है।\n• ट्रिटिकेल में प्रोटीन की मात्रा 11.8% से 22.5% तक होती है, जो आम तौर पर मक्का और गेहूँ से अधिक होती है।\n• यह अमीनो एसिड में भी उच्च है और पशु पोषण के लिए अच्छा है।\n• ट्रिटिकेल में गेहूँ की तुलना में कम ग्लूटेन होता है।", "Triticale is known as a man-made cereal grain.\n• It is developed by crossing wheat and rye.\n• Protein content in Triticale ranges from 11.8% to 22.5%, higher than corn and wheat.\n• It is rich in amino acids and useful for animal feed, containing less gluten than wheat."]

  [
    ["भारत की संघीय व्यवस्था (Federal System) और बेल्जियम के सत्ता-साझाकरण मॉडल के संदर्भ में निम्नलिखित कथनों पर विचार कीजिए:\nA. केंद्र और राज्य/प्रांतीय स्तरों पर शक्तियों का संवैधानिक विभाजन।\nB. विभिन्न सामाजिक, भाषाई और सांस्कृतिक समूहों को प्रतिनिधित्व एवं संरक्षण प्रदान करना।\nC. निर्णय लेने की प्रक्रिया में त्रि-स्तरीय/स्थानीय स्वशासन के माध्यम से जनभागीदारी को बढ़ावा देना।\nD. राज्य सरकारों की पूर्ण प्रशासनिक एवं वित्तीय स्वायत्तता को समाप्त करना।\nसही विकल्प का चयन कीजिए:", "Consider the following statements regarding the Federal System of India and the Power-Sharing model of Belgium:\nA. Constitutional division of powers between central and state/provincial levels.\nB. Providing representation and protection to various social, linguistic, and cultural groups.\nC. Promoting public participation through three-tier/local self-government in decision-making.\nD. Abolishing total administrative and financial autonomy of state governments.\nSelect the correct option:"],
    [["A, B और C", "A, B and C"], ["B, C और D", "B, C and D"], ["A और D", "A and D"], ["A, B, C और D", "A, B, C and D"]],
    0,
    ["भारत की संघीय व्यवस्था और बेल्जियम के सत्ता-साझाकरण मॉडल के संदर्भ में कथन A, B और C सही हैं।\n• भारत और बेल्जियम दोनों ने ही अपनी व्यापक विविधता को समायोजित करने के लिए शक्तियों के विकेंद्रीकरण और सत्ता की साझेदारी का लोकतांत्रिक मॉडल अपनाया है।\n• दोनों देशों में केंद्र और राज्य/प्रांतीय स्तरों पर शक्तियों का स्पष्ट संवैधानिक विभाजन किया गया है।\n• भारत में 73वें और 74वें संविधान संशोधन के माध्यम से स्थानीय स्वशासन लागू किया गया, जो बेल्जियम की 'सामुदायिक सरकार' की तरह ही जनभागीदारी को बढ़ावा देता है।\n• किसी भी आदर्श संघीय व्यवस्था में राज्य सरकारों की स्वायत्तता समाप्त नहीं की जाती।", "Regarding India's federal system and Belgium's power-sharing model, statements A, B, and C are correct.\n• Both India and Belgium adopted democratic power-sharing models to accommodate diversity.\n• Clear constitutional division of power exists between central and state/provincial levels.\n• Decentralization via 73rd and 74th Amendments in India mirrors community governance in Belgium.\n• State autonomy is protected, not abolished, in ideal federal systems."]

  [
    ["समुदायों का पूर्णक्रम जो क्रमशः एक निश्चित स्थान पर बदलता है, कहलाता है-", "The entire sequence of communities that successively changes in a particular area is called-"],
    [["पारिस्थितिक अनुक्रम", "Ecological succession"], ["सीयर", "Sere"], ["समुदाय गतिकी", "Community dynamics"], ["जैवभार का पिरामिड", "Pyramid of biomass"]],
    1,
    ["समुदायों का एक पूर्ण क्रम जो क्रमशः एक निश्चित स्थान पर बदलता है सीयर (क्रमक) कहलाता है।\n• जब किसी खाली या नष्ट हो चुके स्थान पर पौधे और जीव-जंतु धीरे-धीरे एक निश्चित क्रम में बसना शुरू करते हैं, तो इस पूरी प्रक्रिया को अनुक्रमण (Succession) कहते हैं।\n• इसी अनुक्रम विकास को क्रमक या सीयर (Sere) या प्राथमिक क्रमक (Primary Sere) कहा जाता है।\n• यदि प्राथमिक क्रमक की उत्पत्ति ऐसे आवास क्षेत्र में होती है जो इसके पहले जैविक जीव रूपों से खाली था तो उपर्युक्त क्रमक, द्वितीयक क्रमक (Secondary Sere) कहलाता है।", "The entire sequence of communities that successively changes in a given area is called a Sere.\n• Ecological succession refers to the gradual process by which ecosystems change and develop over time.\n• Sere represents the series of developmental stages of a biotic community from pioneer to climax.\n• Secondary seres develop in areas where natural vegetation has been destroyed."]

  [
    ["एक बाज, एक सर्प को, एक सर्प, एक मेंढक को, एक मेंढक टिड्डे को खाते हैं और टिड्डा घास खाता है। इस खाद्य श्रृंखला में बाज है-", "A hawk eats a snake, a snake eats a frog, a frog eats a grasshopper, and the grasshopper eats grass. In this food chain, the hawk is a-"],
    [["प्राथमिक उत्पादक", "Primary producer"], ["प्राथमिक उपभोक्ता", "Primary consumer"], ["तृतीयक उपभोक्ता", "Tertiary consumer"], ["चतुर्थ उपभोक्ता", "Quaternary consumer"]],

    [["भारत के संविधान का कौन-सा अनुच्छेद लिंग के आधार पर भेदभाव का निषेध करता है?", "Which article of the Indian Constitution prohibits discrimination based on gender?"], ["महिला सशक्तिकरण हेतु सरकार द्वारा चलाई जा रही किन्हीं तीन योजनाओं के नाम सूचीबद्ध कीजिए।", "List the names of any three schemes run by the government for women empowerment."], ["\"घरेलू श्रम का असमान विभाजन और अवैतनिक कार्य (Unpaid Care Work) महिलाओं की सामाजिक-आर्थिक स्थिति को किस प्रकार प्रभावित करता है?\" उदाहरण सहित विश्लेषण कीजिए।", "\"How does the unequal division of domestic labor and unpaid care work affect women's socio-economic status?\" Analyze with examples."], ["भारत में प्रथम महिला प्रधानमंत्री कौन थीं और उनका कार्यकाल कितना था?", "Who was the first female Prime Minister of India and what was her tenure?"]],
    2,
    ["विद्यार्थियों में सामाजिक जागरूकता और आलोचनात्मक विचार कौशल विकसित करने के लिए विकल्प (C) का प्रश्न पूछा जाना सबसे उपयुक्त होगा।\n• आलोचनात्मक चिंतन (Critical Thinking) विकसित करने के लिए मुक्त अंत वाले (Open-ended) विश्लेषणात्मक प्रश्न सबसे प्रभावी होते हैं।\n• यह प्रश्न छात्रों को समाज में व्याप्त लैंगिक रूढ़िवाद, महिलाओं के अवैतनिक श्रम (Unpaid care work) और उसके वास्तविक आर्थिक प्रभावों का गहराई से मूल्यांकन करने के लिए प्रेरित करता है।\n• यह प्रश्न विद्यार्थियों को उनके वास्तविक जीवन से जोड़कर विषय की व्यावहारिक समझ विकसित करने में मदद करता है।", "Open-ended analytical questions best foster critical thinking skills in social science.\n• Question (C) prompts students to critically reflect on unpaid care work, gender roles, and economic status rather than recalling rote facts.\n• Connects classroom learning with real-life societal challenges."]

  [
    ["किस अर्थशास्त्री ने भारत में सबसे पहले वैज्ञानिक दृष्टि से राष्ट्रीय आय की गणना की?", "Which economist first calculated national income in India from a scientific perspective?"],
    [["डी०आर० गाडगिल", "D.R. Gadgil"], ["वी०के०आर०वी० राव", "V.K.R.V. Rao"], ["मनमोहन सिंह", "Manmohan Singh"], ["पी०सी० महालनोविस", "P.C. Mahalanobis"]],
    1,
    ["डॉ. वी.के.आर.वी. राव ने सबसे पहले वैज्ञानिक दृष्टि से भारत में राष्ट्रीय आय की गणना की।\n• वी.के.आर.वी. राव ने 1931-32 में भारत की राष्ट्रीय आय की गणना वैज्ञानिक पद्धति पर की थी। उनकी पुस्तक का नाम 'द नेशनल इनकम ऑफ ब्रिटिश इण्डिया' (1938) था।\n• भारत में सबसे पहले राष्ट्रीय आय का अनुमान 1868 में दादाभाई नौरोजी ने लगाया था (₹20 प्रति व्यक्ति आय)।\n• आजादी के बाद 1949 में बनी राष्ट्रीय आय समिति के अध्यक्ष पी.सी. महालनोबिस थे।", "Dr. V.K.R.V. Rao was the first to estimate national income scientifically in India for 1931-32.\n• Authored 'The National Income of British India' (1938).\n• Dadabhai Naoroji made the first informal estimation of national income in 1868 (₹20 per capita).\n• P.C. Mahalanobis headed the National Income Committee in 1949."]

    ["ग्रीष्म ऋतु में चलने वाली इन स्थानीय हवाओं को कालबैशाखी (Kalbaishakhi) कहा जाता है।\n• कालबैशाखी / नॉर्वेस्टर्स पश्चिम बंगाल और असम में चलने वाली विनाशकारी चक्रवाती वर्षा और हवाएँ हैं। असम में इन्हें 'बोडोइचिला' (Bordoisila) कहा जाता है।\n• यह चाय, जूट और चावल की खेती के लिए लाभदायक होती हैं।\n• दक्षिण भारत में प्री-मानसून वर्षा को 'चेरी ब्लॉसम' (कॉफी वर्षा) और 'आम्र वर्षा' (Mango Showers) कहा जाता है।", "Kalbaishakhi (Nor'westers) are localized rainfall thunderstorms in Bengal and Assam during pre-monsoon summer.\n• Known as Bordoisila in Assam.\n• Beneficial for tea, jute, and rice crops."]

    [["विद्यार्थी A : स्वतंत्र और निष्पक्ष चुनाव नागरिकों को बिना किसी भय के अपनी इच्छा से सरकार चुनने का अवसर देते हैं।", "Student A: Free and fair elections allow citizens to choose a government of their choice without fear."], ["विद्यार्थी B : निष्पक्ष चुनाव केवल सत्तारूढ़ दल को स्थायी रूप से सत्ता में बनाए रखने का एक औपचारिक माध्यम हैं।", "Student B: Fair elections are merely a formal means to keep the ruling party permanently in power."], ["विद्यार्थी C : यह प्रक्रिया जनप्रतिनिधियों की जन-जवाबदेही और लोकतंत्र की वैधता को सुनिश्चित करती है।", "Student C: This process ensures public accountability of representatives and democratic legitimacy."], ["विद्यार्थी D: निष्पक्ष चुनाव सत्ता के दुरुपयोग पर अंकुश लगाते हैं और शांतिपूर्ण सत्ता परिवर्तन को संभव बनाते हैं।", "Student D: Fair elections curb abuse of power and enable peaceful transfer of power."]],

    ["विद्यार्थी B का उत्तर दर्शाता है कि उसने अवधारणा को समझा नहीं है।\n• स्वतंत्र और निष्पक्ष चुनाव किसी एक दल को स्थायी रूप से सत्ता में बनाए रखने के लिए नहीं, बल्कि जनता द्वारा सरकार को बदलने का वास्तविक विकल्प प्रदान करने के लिए होते हैं।\n• भारत के संविधान के अनुच्छेद 324 में स्वतंत्र चुनाव कराने हेतु 'भारत निर्वाचन आयोग' का प्रावधान है।", "Student B's answer reflects a complete misconception of democracy.\n• Democratic elections provide genuine opportunities to change the ruling party, ensuring public accountability and rule of law."]

    ["कैमूर पठार चूना पत्थर (Limestone) के लिए प्रसिद्ध है।\n• कैमूर और रोहतास क्षेत्र विंध्य क्रम की चट्टानों से बने हैं, जहाँ चूना पत्थर और पायराइट प्रचुर मात्रा में मिलते हैं।\n• बिहार में बॉक्साइट मुंगेर/जमुई में और अभ्रक गया/नवादा/मुंगेर में पाया जाता है।\n• रोहतास का अमझोर पायराइट उत्पादन के लिए प्रसिद्ध है।", "Kaimur Plateau is famous for limestone deposits belonging to the Vindhyan rock system.\n• Amjhore in Rohtas is famous for pyrites.\n• Bauxite is found in Munger and Jamui districts."]

  [
    ["भारत के जननांकिकीय इतिहास में महान विभाजक की संज्ञा किस वर्ष को दी गई है?", "Which year is called the 'Great Divide' in the demographic history of India?"],
    [["1911", "1911"], ["1921", "1921"], ["1872", "1872"], ["1881", "1881"]],
    1,
    ["वर्ष 1921 को भारत के जननांकिकीय इतिहास में 'महान विभाजक वर्ष' (Year of Great Divide) कहा जाता है।\n• 1911 से 1921 के दशक में महामारी (स्पेनिश फ्लू), अकाल और अस्वास्थ्यकर परिस्थितियों के कारण भारत की जनसंख्या वृद्धि दर ऋणात्मक (-0.31%) दर्ज की गई थी।\n• 1921 के बाद से भारत की जनसंख्या में निरंतर तीव्र वृद्धि हुई है।\n• प्रथम जनगणना 1872 (लॉर्ड मेयो) और प्रथम नियमित जनगणना 1881 (लॉर्ड रिपन) में हुई थी। 1951 को 'लघु विभाजक वर्ष' कहा जाता है।", "1921 is known as the 'Great Divide' year in Indian demographics.\n• Between 1911-1921, India recorded a negative population growth rate (-0.31%) due to famines and Spanish flu.\n• First census took place in 1872 (Lord Mayo); regular censuses began in 1881 (Lord Ripon)."]

    ["व्यावसायिक बैंक (Commercial Bank) संस्थागत वित्त (Institutional Finance) का साधन है।\n• वित्त के दो मुख्य स्रोत होते हैं: संस्थागत (बैंक, सहकारी समितियाँ, RRB) और गैर-संस्थागत (साहूकार, महाजन, व्यापारी, रिश्तेदार)।\n• संस्थागत स्रोत उचित ब्याज दर और पारदर्शी शर्तों पर ऋण प्रदान करते हैं।", "Commercial Banks are formal institutional financial sources.\n• Non-institutional sources (Mahajans, Sahukars) charge high interest rates and operate informally."]

/* ============ STATE ============ */
const state = DATA.map(() => ({selected:null, lang:0, expl:false})); // lang: 0=hi,1=en
let instaMode = false;
let retakeIdx = [];
const startTime = new Date();
let submitted = false;
let currentFilter = 'all';

/* ============ RENDER ============ */
const container = document.getElementById('quizContainer');

function optLetter(i){ return ['A','B','C','D'][i]; }

function renderQuestion(idx){
  const d = DATA[idx];
  const s = state[idx];
  const lang = s.lang;
  const reveal = submitted || (instaMode && s.selected !== null);

  const card = document.createElement('div');
  card.className = 'qcard';
  card.id = 'q'+idx;

  const head = document.createElement('div');
  head.className = 'qhead';
  const num = document.createElement('div');
  num.className = 'qnum';
  num.textContent = (idx+1) + '.';
  const langBtn = document.createElement('button');
  langBtn.className = 'langbtn';
  langBtn.type = 'button';
  langBtn.textContent = lang === 0 ? '✦ In English' : '✦ हिंदी में';
  langBtn.onclick = () => { s.lang = s.lang === 0 ? 1 : 0; rerenderQuestion(idx); };
  head.appendChild(num);
  head.appendChild(langBtn);
  card.appendChild(head);

  const qtext = document.createElement('p');
  qtext.className = 'qtext';
  qtext.textContent = d[0][lang];
  card.appendChild(qtext);

  const opts = document.createElement('div');
  opts.className = 'options';
  d[1].forEach((opt, oi) => {
    const optDiv = document.createElement('div');
    optDiv.className = 'opt';
    if(reveal){
      optDiv.classList.add('locked');
      if(oi === d[2]) optDiv.classList.add('review-correct');
      else if(oi === s.selected) optDiv.classList.add('review-wrong');
    } else if(s.selected === oi){
      optDiv.classList.add('selected');
    }
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = '(' + optLetter(oi) + ')';
    const txt = document.createElement('span');
    txt.textContent = opt[lang];
    optDiv.appendChild(tag);
    optDiv.appendChild(txt);
    if(!reveal){
      optDiv.onclick = () => {
        s.selected = oi;
        if(instaMode) s.expl = true;
        rerenderQuestion(idx);
        updateProgress();
      };
    }
    opts.appendChild(optDiv);
  });
  card.appendChild(opts);

  const foot = document.createElement('div');
  foot.className = 'qfoot';

  if(reveal){
    const isCorrect = s.selected === d[2];
    card.classList.add(isCorrect ? 'correct' : 'incorrect');
    const pill = document.createElement('span');
    pill.className = 'result-pill ' + (isCorrect ? 'correct' : 'incorrect');
    pill.textContent = isCorrect ? '✓ Correct' : (s.selected === null ? '— Not Answered' : '✗ Incorrect');
    foot.appendChild(pill);
  }

  const explBtn = document.createElement('button');
  explBtn.className = 'iconbtn small explbtn' + (s.expl ? ' active' : '');
  explBtn.type = 'button';
  explBtn.title = 'Show/Hide Explanation / व्याख्या देखें';
  explBtn.textContent = '💡';
  const explDiv = document.createElement('div');
  explDiv.className = 'explanation' + (s.expl ? ' open' : '');
  explDiv.textContent = d[3][lang];
  explBtn.onclick = () => {
    s.expl = !s.expl;
    explDiv.classList.toggle('open', s.expl);
    explBtn.classList.toggle('active', s.expl);
    updateExpandBtn();
  };
  foot.appendChild(explBtn);
  card.appendChild(foot);
  card.appendChild(explDiv);

  return card;
}

function rerenderQuestion(idx){
  const old = document.getElementById('q'+idx);
  const fresh = renderQuestion(idx);
  old.replaceWith(fresh);
  updateExpandBtn();
}

function renderAll(){
  container.innerHTML = '';
  let indices = DATA.map((_,i)=>i);
  if(submitted){
    if(currentFilter === 'incorrect') indices = indices.filter(i => state[i].selected !== DATA[i][2]);
    else if(currentFilter === 'correct') indices = indices.filter(i => state[i].selected === DATA[i][2]);
  }
  if(currentFilter === 'retake' && !submitted) indices = retakeIdx;
  if(indices.length === 0){
    const msg = document.createElement('p');
    msg.style.textAlign = 'center';
    msg.style.color = '#5a5145';
    msg.textContent = 'कोई प्रश्न नहीं मिला। / No questions found in this view.';
    container.appendChild(msg);
    return;
  }
  indices.forEach(i => container.appendChild(renderQuestion(i)));
  updateExpandBtn();
}

function updateProgress(){
  const answered = state.filter(s => s.selected !== null).length;
  document.getElementById('progressFill').style.width = (answered) + '%';
  document.getElementById('progressLabel').textContent = answered + ' / 100 answered';
}

/* ============ SUBMIT & SCORE ============ */
document.getElementById('submitBtn').addEventListener('click', () => {
  const unanswered = state.filter(s => s.selected === null).length;
  if(unanswered > 0){
    const ok = confirm(unanswered + ' प्रश्न अभी भी अनुत्तरित हैं। क्या आप फिर भी जमा करना चाहते हैं?\n\n' + unanswered + ' question(s) are still unanswered. Submit anyway?');
    if(!ok) return;
  }
  finalizeSubmit();
});

function finalizeSubmit(){
  submitted = true;
  currentFilter = 'all';
  document.getElementById('retakeBanner').style.display = 'none';
  document.querySelectorAll('.filterRow button').forEach(b=>b.classList.remove('active'));
  document.getElementById('showAllBtn').classList.add('active');

  const score = state.filter((s,i) => s.selected === DATA[i][2]).length;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('scoreSub').textContent = score + ' सही, ' + (100-score) + ' गलत/अनुत्तरित out of 100';
  clearInterval(timerInterval);
  timerDisplay.classList.remove('timeup');
  document.getElementById('timeTakenLabel').textContent = 'समय लगा / Time Taken: ' + formatTimer(elapsedSeconds);
  document.getElementById('scorePanel').style.display = 'block';
  document.getElementById('submitBtn').textContent = 'Submitted ✓';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').style.opacity = '0.6';
  document.getElementById('submitBtn').style.cursor = 'default';

  renderAll();
  document.getElementById('scorePanel').scrollIntoView({behavior:'smooth'});
}

document.getElementById('jumpBtn').addEventListener('click', () => {
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ============ FILTERS ============ */
function setFilter(f, btnId){
  currentFilter = f;
  document.querySelectorAll('.filterRow button').forEach(b=>b.classList.remove('active'));
  document.getElementById(btnId).classList.add('active');
  document.getElementById('retakeBanner').style.display = 'none';
  renderAll();
  window.scrollTo({top: document.getElementById('scorePanel').offsetTop - 10, behavior:'smooth'});
}
document.getElementById('showAllBtn').addEventListener('click', () => setFilter('all','showAllBtn'));
document.getElementById('showIncorrectBtn').addEventListener('click', () => setFilter('incorrect','showIncorrectBtn'));
document.getElementById('showCorrectBtn').addEventListener('click', () => setFilter('correct','showCorrectBtn'));

/* ============ RETAKE INCORRECT ============ */
document.getElementById('retakeBtn').addEventListener('click', () => {
  const incorrectIdx = state.map((s,i)=> s.selected !== DATA[i][2] ? i : -1).filter(i=>i!==-1);
  if(incorrectIdx.length === 0){
    alert('बधाई हो! सभी उत्तर सही हैं। / Congratulations! All answers are correct — nothing to retake.');
    return;
  }
  incorrectIdx.forEach(i => { state[i].selected = null; state[i].expl = false; });
  retakeIdx = incorrectIdx;
  submitted = false;
  currentFilter = 'retake';
  document.getElementById('scorePanel').style.display = 'none';
  document.getElementById('submitBtn').textContent = 'Submit All Answers';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').style.opacity = '1';
  document.getElementById('submitBtn').style.cursor = 'pointer';

  const banner = document.getElementById('retakeBanner');
  banner.style.display = 'block';
  banner.textContent = 'पुनः प्रयास मोड: केवल ' + incorrectIdx.length + ' पहले गलत प्रश्न नीचे दिखाए गए हैं। / Retake mode: only your ' + incorrectIdx.length + ' previously incorrect question(s) are shown below.';

  container.innerHTML = '';
  incorrectIdx.forEach(i => container.appendChild(renderQuestion(i)));
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ============ GLOBAL LANGUAGE TOGGLE ============ */
let globalLang = 0; // 0 = hi, 1 = en
const langGlobalBtn = document.getElementById('langGlobalBtn');
langGlobalBtn.addEventListener('click', () => {
  globalLang = globalLang === 0 ? 1 : 0;
  state.forEach(s => { s.lang = globalLang; });
  langGlobalBtn.textContent = globalLang === 0 ? 'In English' : 'हिंदी में';
  renderAll();
});

/* ============ TIMER ============ */
const TIMER_CAP_SECONDS = 100 * 60;
let elapsedSeconds = 0;
const timerText = document.getElementById('timerText');
const timerDisplay = document.getElementById('timerDisplay');
function formatTimer(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const sec = totalSeconds % 60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
const timerInterval = setInterval(() => {
  if(elapsedSeconds >= TIMER_CAP_SECONDS){
    timerDisplay.classList.add('timeup');
    clearInterval(timerInterval);
    return;
  }
  elapsedSeconds++;
  timerText.textContent = formatTimer(elapsedSeconds);
}, 1000);

/* ============ DASHBOARD MODAL ============ */
const dashboardModal = document.getElementById('dashboardModal');
function renderDashboard(){
  const grid = document.getElementById('dashGrid');
  grid.innerHTML = '';
  state.forEach((s,i) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'dashCell ' + (s.selected !== null ? 'attempted' : 'unattempted');
    cell.textContent = i + 1;
    cell.title = 'Question ' + (i+1) + (s.selected !== null ? ' — Attempted' : ' — Unattempted');
    cell.onclick = () => {
      if(submitted && currentFilter !== 'all'){
        currentFilter = 'all';
        document.querySelectorAll('.filterRow button').forEach(b=>b.classList.remove('active'));
        document.getElementById('showAllBtn').classList.add('active');
        renderAll();
      }
      dashboardModal.classList.remove('open');
      const target = document.getElementById('q'+i);
      if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
    };
    grid.appendChild(cell);
  });
}
document.getElementById('dashboardBtn').addEventListener('click', () => {
  renderDashboard();
  dashboardModal.classList.add('open');
});
document.getElementById('dashboardCloseBtn').addEventListener('click', () => dashboardModal.classList.remove('open'));
dashboardModal.addEventListener('click', (e) => { if(e.target === dashboardModal) dashboardModal.classList.remove('open'); });

/* ============ FULLSCREEN TOGGLE & HEADER DOUBLE TAP ============ */
function toggleFullScreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}
const fullscreenBtn = document.getElementById('fullscreenBtn');
fullscreenBtn.addEventListener('click', toggleFullScreen);
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '🗗' : '⛶';
});

// Double tap / double click header feature
let lastHeaderTap = 0;
const headerElem = document.getElementById('headerElem');
headerElem.addEventListener('click', (e) => {
  if(e.target.closest('.toolbar') || e.target.closest('.progress-wrap')) return;
  const now = new Date().getTime();
  if (now - lastHeaderTap < 300) {
    toggleFullScreen();
  }
  lastHeaderTap = now;
});

/* ============ SEARCH BAR FEATURE ============ */
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if(!query) return;
  const matchIndex = DATA.findIndex(d => 
    d[0][0].toLowerCase().includes(query) || 
    d[0][1].toLowerCase().includes(query)
  );
  if(matchIndex !== -1){
    if(submitted && currentFilter !== 'all'){
      currentFilter = 'all';
      document.querySelectorAll('.filterRow button').forEach(b=>b.classList.remove('active'));
      document.getElementById('showAllBtn').classList.add('active');
      renderAll();
    }
    const elem = document.getElementById('q' + matchIndex);
    if(elem) elem.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});

/* ============ INSTA-RESPONSE & EXPAND-ALL ============ */
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
const instaBtn = document.getElementById('instaBtn');
instaBtn.addEventListener('click', () => {
  instaMode = !instaMode;
  instaBtn.classList.toggle('active', instaMode);
  instaBtn.setAttribute('aria-pressed', instaMode);
  keepScroll(renderAll);
});
const expandAllBtn = document.getElementById('expandAllBtn');
function updateExpandBtn(){
  const all = state.every(s => s.expl);
  expandAllBtn.textContent = all ? '▴ Collapse All Explanations' : '▾ Expand All Explanations';
}
expandAllBtn.addEventListener('click', () => {
  const target = !state.every(s => s.expl);
  state.forEach(s => { s.expl = target; });
  keepScroll(renderAll);
});

/* ============ INIT ============ */
renderAll();
updateProgress();

/* ============ EXCEL RECORD EXPORT ============ */
(function(){
  const HEAD = ['Date','Test Paper/Set','Score','Duration','Time','Answers','Incorrect'];
  let stamp = null, override = null;
  const btn = document.getElementById('copyExcelBtn');
  const status = document.getElementById('copyStatus');
  const clean = v => String(v).replace(/[\t\r\n]+/g,' ').trim();
  const p2 = n => String(n).padStart(2,'0');

  function getResponsesList(){
    const list = [];
    state.forEach((x, i) => {
      if(x.selected !== null){
        const isCorrect = x.selected === DATA[i][2];
        const mark = isCorrect ? '✓' : '✗';
        list.push((i + 1) + '.' + optLetter(x.selected) + ' ' + mark);
      } else {
        list.push((i + 1) + '.- ✗');
      }
    });
    return list.join(', ');
  }

  function getIncorrectList(){
    const list = [];
    state.forEach((x, i) => {
      if(x.selected !== DATA[i][2]){
        list.push(i + 1);
      }
    });
    return list.length ? list.join(', ') : 'None';
  }

  function buildRow(){
    const d = stamp || new Date();
    const hm = x => p2(x.getHours())+':'+p2(x.getMinutes());
    const date = override ? override.date : startTime.getFullYear()+'-'+p2(startTime.getMonth()+1)+'-'+p2(startTime.getDate());
    const range = override ? override.range : hm(startTime)+' - '+hm(d);
    const score = state.filter((x,i)=> x.selected === DATA[i][2]).length;
    const paper = clean(document.getElementById('paperName').value) || 'Test';
    const responsesList = getResponsesList();
    const incorrectList = getIncorrectList();
    return [date, paper, "'"+score+'/'+DATA.length, formatTimer(elapsedSeconds), range, responsesList, incorrectList];
  }
  function renderPreview(){
    const r = buildRow();
    document.getElementById('exportPreview').innerHTML =
      '<tr>'+HEAD.map(h=>'<th>'+h+'</th>').join('')+'</tr><tr>'+r.map(v=>'<td>'+String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</td>').join('')+'</tr>';
  }
  function tsv(){
    const rows = [];
    if(document.getElementById('withHeader').checked) rows.push(HEAD.join('\t'));
    rows.push(buildRow().map(clean).join('\t'));
    return rows.join('\n');
  }
  async function copyText(t){
    try{ await navigator.clipboard.writeText(t); return true; }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      let ok=false; try{ ok = document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta); return ok;
    }
  }
  document.getElementById('submitBtn').addEventListener('click', () => {
    if(!submitted) return;
    stamp = new Date();
    override = null;
    btn.disabled = false;
    renderPreview();
  });
  document.getElementById('paperName').addEventListener('input', renderPreview);
  btn.addEventListener('click', async () => {
    if(!submitted){ status.textContent = 'Submit answers first / पहले उत्तर जमा करें'; return; }
    const ok = await copyText(tsv());
    status.textContent = ok ? 'Copied ✓ — paste into Excel (Ctrl+V) / कॉपी हो गया' : 'Copy failed — select the row above and copy manually.';
    setTimeout(()=>{ status.textContent=''; }, 4000);
  });

  /* Restore previous attempt */
  document.getElementById('rcHeads').innerHTML = HEAD.map(h => '<span class="rcChip">'+h+'</span>').join('');
  const pasteBox = document.getElementById('pasteBox');
  const rStatus = document.getElementById('restoreStatus');
  function say(msg, cls){ rStatus.textContent = msg; rStatus.className = cls || ''; }
  function parseRow(text){
    if(!text || !text.trim()) return null;
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    for(let i = lines.length - 1; i >= 0; i--){
      const cols = lines[i].split('\t').map(c => c.trim().replace(/^"(.*)"$/, '$1'));
      // Ensure it's not the header row
      if(cols.length >= 2 && cols[0].toLowerCase() !== 'date'){
        return cols;
      }
    }
    return null;
  }
  document.getElementById('restoreBtn').addEventListener('click', () => {
    const r = parseRow(pasteBox.value);
    if(!r){ say('Nothing to restore – paste a valid Excel row first / पहले वैध एक्सेल पंक्ति पेस्ट करें', 'bad'); return; }
    
    // We expect at least 6-7 columns (Date, Paper, Score, Duration, Time, Answers, [Incorrect])
    if(r.length < 5){
      say('Expected tab-separated columns from Excel, but found fewer. Please copy the entire Excel row.', 'bad'); 
      return;
    }

    // Parse Duration / Time
    const durStr = r[3] || "0:00:00";
    const m = durStr.match(/^(\d+):(\d{1,2}):(\d{1,2})$/);
    elapsedSeconds = m ? (+m[1])*3600 + (+m[2])*60 + (+m[3]) : 0;
    timerText.textContent = formatTimer(elapsedSeconds);

    // Set paper name
    if(r[1]) document.getElementById('paperName').value = r[1];
    override = { date: r[0] || '', range: r[4] || '' };
    stamp = null;

    // Reset current state selections
    state.forEach(s => { s.selected = null; });

    // Parse Answers column (usually column index 5)
    const answersCol = r[5] || '';
    if(answersCol){
      // Matches pattern like "1.A ✓", "2.B ✗", "12.C"
      const itemRegex = /(\d+)\.([A-D])\b/gi;
      let match;
      const letterMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
      while((match = itemRegex.exec(answersCol)) !== null){
        const qNum = parseInt(match[1], 10) - 1;
        const optLetter = match[2].toUpperCase();
        if(qNum >= 0 && qNum < DATA.length && letterMap.hasOwnProperty(optLetter)){
          state[qNum].selected = letterMap[optLetter];
        }
      }
    }

    // Fallback: If answers column is empty or missing, parse Incorrect list (column index 6)
    const incorrectCol = r[6] || '';
    if(!answersCol && incorrectCol && incorrectCol !== 'None'){
      const incNums = incorrectCol.split(',').map(n => parseInt(n.trim(), 10) - 1).filter(n => !isNaN(n));
      // Mark all non-incorrect as correct answers
      DATA.forEach((d, idx) => {
        if(!incNums.includes(idx)){
          state[idx].selected = d[2];
        }
      });
    }

    finalizeSubmit();
    btn.disabled = false;
    renderPreview();
    updateProgress();
    say('Restored ✔ / सफलतापूर्वक पुनः लोड हो गया', 'ok');
    setTimeout(() => { say(''); }, 4000);
  });
})();
</script>
